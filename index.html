<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Meta -->
    <title>Zentry — Personal Life Dashboard</title>
    <meta name="description" content="A dark, minimal personal dashboard with live news from 32 countries, a live radio world map, today's football scores, and a language learning tracker." />
    <meta name="keywords" content="personal dashboard, news tracker, language planner, live radio, football scores, zentry" />
    <meta name="author" content="Lauger" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://zentry-dash.vercel.app/" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://zentry-dash.vercel.app/" />
    <meta property="og:title" content="Zentry — Personal Life Dashboard" />
    <meta property="og:description" content="Live news, world radio, football scores, and language planning — all in one dark dashboard." />
    <meta property="og:image" content="https://zentry-dash.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Zentry — your day in one place: news, live football, world radio and language practice." />
    <meta property="og:site_name" content="Zentry" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://zentry-dash.vercel.app/" />
    <meta name="twitter:title" content="Zentry — Personal Life Dashboard" />
    <meta name="twitter:description" content="Live news, world radio, football scores, and language planning — all in one dark dashboard." />
    <meta name="twitter:image" content="https://zentry-dash.vercel.app/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F3EFE8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131210" />

    <!-- Resolve the theme before first paint so there's no light/dark flash.
         'auto' (the default) follows the OS; Layout.jsx keeps it in sync after. -->
    <script>
      try {
        var p = localStorage.getItem('zentry:theme')
        document.documentElement.dataset.theme = p === 'light' || p === 'dark' ? p
          : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
      } catch (e) { document.documentElement.dataset.theme = 'dark' }
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script data-goatcounter="https://zentry.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
  </body>
</html>
